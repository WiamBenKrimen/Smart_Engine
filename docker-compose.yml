services:
  mysql:
    image: mysql:8.4
    container_name: smart_engine_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: smart_engine
    ports:
      - "3306:3306"
    volumes:
      - smart_engine_mysql_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro

volumes:
  smart_engine_mysql_data:
